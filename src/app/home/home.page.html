<!-- eslint-disable @angular-eslint/template/prefer-control-flow -->
<ion-content [fullscreen]="true">
  <ion-card>
    <ion-item>
      <ion-select label="Figura Geométrica" placeholder="Escoja una figura geométrica..." [(ngModel)]="figuraSeleccionada">
        <ion-select-option value="circulo">círculo</ion-select-option>
        <ion-select-option value="triangulo">triángulo</ion-select-option>
      </ion-select>
    </ion-item>
  </ion-card>

  <app-circulo *ngIf="figuraSeleccionada === 'circulo'"></app-circulo>
  <app-triangulo *ngIf="figuraSeleccionada === 'triangulo'"></app-triangulo>
</ion-content>
